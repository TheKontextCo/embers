name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    # Pin the public support floor instead of allowing `-latest` to drift.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Install pinned complexity analyzer
        run: |
          mkdir -p "$RUNNER_TEMP/swiftlint"
          curl --fail --location --retry 3 https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "EMBERS_SWIFTLINT=$RUNNER_TEMP/swiftlint/swiftlint" >> "$GITHUB_ENV"
      - name: Check complexity
        run: |
          ./scripts/test-complexity-gate.sh
          ./scripts/verify-complexity.sh
      - name: Check repository readiness
        run: ./scripts/verify-repository-readiness.sh
      - name: Check release scripts
        run: ./scripts/test-release-scripts.sh
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
